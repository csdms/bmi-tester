name: Test

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Where to publish (leave blank to just build/test)"
        type: choice
        required: false
        default: ""
        options:
          - ""
          - testpypi
          - pypi

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Test
        run: |
          pip install nox
          nox -s test

      - name: Test CLI
        run: |
          nox -s test-cli

  tests-passed:
    needs: build-and-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "One or more tests failed: $RESULT"
            exit 1
          fi
          echo "All tests passed."

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Test
        run: |
          pip install nox
          nox -s coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: csdms/bmi-tester
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

  publish:
    needs: "build-and-test"
    name: "Publish to PyPI/TestPyPI"
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && inputs.publish_to != ''

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Build
        run: |
          pip install nox
          nox -s build

      - name: Publish to testpypi
        if: inputs.publish_to == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          print-hash: true
          verify-metadata: true
          verbose: true

      - name: Publish to pypi
        if: inputs.publish_to == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          print-hash: true
          verify-metadata: true
          verbose: true
